name: Publish package

# Publishes to GitHub Packages and attaches the jars to the GitHub Release.
#
# Triggered by publishing a release (tag it `v0.1.0`), or manually with an explicit version.
# GitHub Packages rejects a re-publish of an existing version with 409 Conflict, so every
# release needs a new version number.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: write   # to attach jars to the release
  packages: write   # to publish to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes a settings.xml with a <server id="github"> entry matching the pom's
          # distributionManagement, credentialed from the env vars named below.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Resolve version
        # Via env rather than direct interpolation so a tag name cannot inject shell.
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version to publish"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version $VERSION"

      - name: Set project version
        run: ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Publish to GitHub Packages
        # `deploy` runs the full lifecycle, so the test suite gates the release.
        run: ./mvnw -B --no-transfer-progress deploy -Dgithub.repository=${{ github.repository }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach jars to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/whoop-java-sdk-${{ env.VERSION }}.jar
            target/whoop-java-sdk-${{ env.VERSION }}-sources.jar
            target/whoop-java-sdk-${{ env.VERSION }}-javadoc.jar
